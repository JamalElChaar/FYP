# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  joint_1:
    # Continuous in the URDF: the base rotates a full 360 deg, so there is no
    # position window to enforce here.
    # No servo calibrated on this joint; left unbounded.
    has_position_limits: false
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_2:
    has_position_limits: true
    min_position: -1.808796   # servo 0 or 180 (-103.64 .. +76.36 deg)
    max_position: 1.332796
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_3:
    has_position_limits: true
    min_position: -1.943796   # servo 0 or 180 (-111.37 .. +68.63 deg)
    max_position: 1.197796
    # Component physically rotated 180 deg, so the servo sense is reversed:
    # servo = 90 - ros_deg. The ROS window is unchanged; only the mapping is.
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_4:
    has_position_limits: true
    min_position: 0.000000   # servo 0 or 180 (0 .. +180 deg)
    max_position: 3.141593
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_5:
    has_position_limits: true
    min_position: -1.570796   # servo 0 or 180 (-90 .. +90 deg)
    max_position: 1.570796
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_6:
    # No servo calibrated on this joint; left unbounded.
    has_position_limits: false
    has_velocity_limits: true
    max_velocity: 1.5
    has_acceleration_limits: true
    max_acceleration: 3.0
