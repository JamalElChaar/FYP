# Default initial positions for robot_arm's ros2_control fake system
#
# These correspond to servo 90 deg on every joint -- the position the ESP32
# firmware drives every servo to at boot -- converted through the calibrated
# offset/direction. Note this is NOT all-zeros: with the calibration applied,
# ROS 0 is not the servo centre for most joints. Recalibrated 2026-09-29
# from RViz readings at servo 90 and servo 0.

initial_positions:
  joint_1: 0.000000   # servo 90 deg
  joint_2: -0.238000   # servo 90 deg
  joint_3: -0.373000   # servo 90 deg
  joint_4: 1.570796   # servo 90 deg
  joint_5: 0.000000   # servo 90 deg
  joint_6: 0.000000   # servo 90 deg
